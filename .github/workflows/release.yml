name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.10.1, etc.
  workflow_dispatch:  # Allow manual triggering for testing

permissions:
  contents: write  # Required for creating releases and uploading assets

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows 10 - amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: claudio-windows-amd64.exe
          # macOS - amd64 (Intel)
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary_name: claudio-darwin-amd64
          # macOS - arm64 (Apple Silicon)
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: claudio-darwin-arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: true
      
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0  # Static binary without C dependencies
        run: |
          go build -v -ldflags="-s -w" -o ${{ matrix.binary_name }} .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      
      - name: Display structure of downloaded files
        run: ls -R dist
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/claudio-windows-amd64.exe/claudio-windows-amd64.exe
            dist/claudio-darwin-amd64/claudio-darwin-amd64
            dist/claudio-darwin-arm64/claudio-darwin-arm64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
